name = "random-visual-novel-generator"
main = "worker.js"
compatibility_date = "2026-08-14"

# Serves the static site from ../public (the repo moved to a public/-only static
# serving layout after this Worker setup was retired, see server/index.js). Files listed
# in .assetsignore (worker.js, this config, etc.) are excluded from being served as
# public assets, though nothing in public/ actually matches those names anymore.
[assets]
directory = "../public"
binding = "ASSETS"

# The image cache bucket created in the R2 dashboard.
[[r2_buckets]]
binding = "COVERS_BUCKET"
bucket_name = "rvng-covers"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false

# VN + tag database imported from VNDB's own dump, refreshed via db/refresh-vndb-db.mjs
# (that script now targets the self-hosted sqlite setup by default, this D1 database is
# no longer kept in sync unless you specifically revert it back to the wrangler workflow)
[[d1_databases]]
binding = "VNDB_DB"
database_name = "randomvn-db"
database_id = "690aa2fc-340b-4854-bf0d-14cbe1ddee47"
